<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="theme-color" content="#07080c">
  <meta name="color-scheme" content="dark">
  <meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Track a Changer Server Free Fire request reference.">
<title>Track Request — Changer Server Free Fire</title>
<link rel="stylesheet" href="style-v4.css"><link rel="icon" type="image/jpeg" href="site-logo.jpg">
<style>
.track-page{width:min(calc(100% - 24px),760px);margin:auto;padding:56px 0 90px}.track-card-page{padding:26px;background:linear-gradient(180deg,rgba(24,14,31,.97),rgba(12,8,17,.98));border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}.track-card-page h1{font-size:clamp(32px,7vw,54px);line-height:1.05;margin:8px 0 12px}.track-card-page p{color:var(--muted)}.track-form{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin-top:24px}.result{display:none;margin-top:18px}.result.show{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.result>div{padding:14px;border:1px solid rgba(255,255,255,.08);border-radius:13px;background:#0b0710}.result small{display:block;color:#8f8596;margin-bottom:5px}.result strong{display:block;overflow-wrap:anywhere}.not-found{padding:15px;border:1px solid rgba(255,100,100,.2);border-radius:12px;color:#ffb5b5;background:rgba(255,70,70,.06)}@media(max-width:600px){.track-page{padding:30px 0 60px}.track-card-page{padding:18px}.track-form,.result.show{grid-template-columns:1fr}.track-form .btn{width:100%}}
</style>
</head>
<body>
<header class="header"><a class="brand" href="index.html"><span>Changer Server<br><b>Free Fire</b></span></a><nav id="nav"><a href="index.html#home" data-i18n="home">Home</a><a href="index.html#service" data-i18n="service">Service</a><a href="index.html#how" data-i18n="how">How it works</a><a href="index.html#track" data-i18n="trackNav">Track</a><a href="index.html#contact" data-i18n="contact">Contact</a><a class="admin-link" href="admin.html" data-i18n="admin">Admin</a></nav><select id="language" aria-label="Language"><option value="en">English (Official)</option><option value="fr">Français</option><option value="ar">العربية</option><option value="pt">Português</option><option value="es">Español</option></select><button class="menu" id="menu" aria-label="Open menu">☰</button></header>
<main class="track-page"><section class="track-card-page"><div class="eyebrow" data-i18n="trackEyebrow">TRACK REQUEST</div><h1 data-i18n="trackTitle">Check your request status</h1><p data-i18n="trackText">Enter your request reference to view its latest status on this device.</p><div class="track-form"><label><span data-i18n="referenceLabel">Request reference</span><input id="ref" placeholder="CSF-XXXXXX" autocomplete="off"></label><button id="btn" class="btn primary" type="button" data-i18n="trackButton">Track request</button></div><div id="result" class="result" aria-live="polite"></div><div class="actions" style="margin-top:20px"><a class="btn ghost" href="index.html" data-i18n="backHome">Back to website</a></div></section></main>
<script>
const X={en:{home:'Home',service:'Service',how:'How it works',trackNav:'Track',contact:'Contact',admin:'Admin',trackEyebrow:'TRACK REQUEST',trackTitle:'Check your request status',trackText:'Enter your request reference to view its latest status on this device.',referenceLabel:'Request reference',trackButton:'Track request',backHome:'Back to website',notFound:'No request found with this reference.',statusLabel:'Status',createdLabel:'Created',current:'Current region',destination:'Destination region',player:'Player ID',paymentLabel:'Payment'},fr:{home:'Accueil',service:'Service',how:'Fonctionnement',trackNav:'Suivre',contact:'Contact',admin:'Admin',trackEyebrow:'SUIVRE LA DEMANDE',trackTitle:'Vérifiez le statut de votre demande',trackText:'Entrez votre référence pour voir le dernier statut sur cet appareil.',referenceLabel:'Référence de la demande',trackButton:'Suivre la demande',backHome:'Retour au site',notFound:'Aucune demande trouvée avec cette référence.',statusLabel:'Statut',createdLabel:'Créée le',current:'Région actuelle',destination:'Région de destination',player:'ID joueur',paymentLabel:'Paiement'},ar:{home:'الرئيسية',service:'الخدمة',how:'كيف تعمل',trackNav:'تتبع الطلب',contact:'اتصل بنا',admin:'الإدارة',trackEyebrow:'تتبع الطلب',trackTitle:'تحقق من حالة طلبك',trackText:'أدخل رقم الطلب لمعرفة آخر حالة محفوظة على هذا الجهاز.',referenceLabel:'رقم الطلب',trackButton:'تتبع الطلب',backHome:'العودة إلى الموقع',notFound:'لم يتم العثور على طلب بهذا الرقم.',statusLabel:'الحالة',createdLabel:'تاريخ الإنشاء',current:'المنطقة الحالية',destination:'المنطقة المطلوبة',player:'معرّف اللاعب',paymentLabel:'الدفع'},pt:{home:'Início',service:'Serviço',how:'Como funciona',trackNav:'Acompanhar',contact:'Contato',admin:'Admin',trackEyebrow:'ACOMPANHAR SOLICITAÇÃO',trackTitle:'Verifique o status da solicitação',trackText:'Digite a referência para ver o status mais recente neste dispositivo.',referenceLabel:'Referência da solicitação',trackButton:'Acompanhar solicitação',backHome:'Voltar ao site',notFound:'Nenhuma solicitação encontrada com esta referência.',statusLabel:'Status',createdLabel:'Criada em',current:'Região atual',destination:'Região de destino',player:'ID do jogador',paymentLabel:'Pagamento'},es:{home:'Inicio',service:'Servicio',how:'Cómo funciona',trackNav:'Seguimiento',contact:'Contacto',admin:'Admin',trackEyebrow:'SEGUIMIENTO',trackTitle:'Consulta el estado de tu solicitud',trackText:'Introduce la referencia para ver el último estado guardado en este dispositivo.',referenceLabel:'Referencia de solicitud',trackButton:'Seguir solicitud',backHome:'Volver al sitio',notFound:'No se encontró ninguna solicitud con esta referencia.',statusLabel:'Estado',createdLabel:'Creada',current:'Región actual',destination:'Región de destino',player:'ID del jugador',paymentLabel:'Pago'}};
function langApply(l){const t=X[l]||X.en;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(e=>{if(t[e.dataset.i18n])e.textContent=t[e.dataset.i18n]});localStorage.setItem('siteLang',l)}
const sel=document.getElementById('language');sel.value=localStorage.getItem('siteLang')||'en';sel.addEventListener('change',e=>langApply(e.target.value));langApply(sel.value);document.getElementById('menu').addEventListener('click',()=>document.querySelector('.header').classList.toggle('open'));
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(){const l=localStorage.getItem('siteLang')||'en',t=X[l]||X.en,k=document.getElementById('ref').value.trim().toUpperCase(),list=JSON.parse(localStorage.getItem('requests')||'[]'),r=list.find(x=>String(x.ref||'').toUpperCase()===k),out=document.getElementById('result');if(!r){out.className='result show';out.innerHTML='<div class="not-found" style="grid-column:1/-1">'+t.notFound+'</div>';return}let d='';try{d=new Date(r.created).toLocaleString(l,{dateStyle:'medium',timeStyle:'short'})}catch{d=r.created||''}out.className='result show';out.innerHTML='<div><small>'+t.statusLabel+'</small><strong>'+esc(r.status||'Received')+'</strong></div><div><small>'+t.createdLabel+'</small><strong>'+esc(d)+'</strong></div><div><small>'+t.current+'</small><strong>'+esc(r.current)+'</strong></div><div><small>'+t.destination+'</small><strong>'+esc(r.destination)+'</strong></div><div><small>'+t.player+'</small><strong>'+esc(r.player)+'</strong></div><div><small>'+t.paymentLabel+'</small><strong>'+esc(r.paymentMethod||'—')+'</strong></div>'}document.getElementById('btn').addEventListener('click',show);document.getElementById('ref').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();show()}});const q=new URLSearchParams(location.search).get('ref');if(q){document.getElementById('ref').value=q;show()}
</script>
</body></html>
